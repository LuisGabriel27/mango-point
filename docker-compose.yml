services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mangopoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mangopoint}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - mangopoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mangopoint}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mangopoint-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mangopoint}
      CLOUD_SYNC_ENABLED: ${CLOUD_SYNC_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/orchards:/app/data/orchards
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; health = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); sys.exit(0 if health.get('status') == 'healthy' and health.get('database') == 'connected' else 1)"]
      interval: 10s
      timeout: 6s
      retries: 12

volumes:
  mangopoint-postgres-data:
